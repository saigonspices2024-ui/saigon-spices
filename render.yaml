# Cấu hình deploy Render (Blueprint) cho Saigon Spices KDS.
# 2 service: saigon-kds (màn bếp) + saigon-order (QR order, khách trả trước).
services:
  - type: web
    name: saigon-kds
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      # Token Square của Saigon Spices: đặt trong Render Dashboard (KHÔNG ghi vào file này).
      # Token + env phải ĐỒNG BỘ CẶP: sandbox-token+sandbox, hoặc production-token+production.
      - key: SQUARE_ACCESS_TOKEN
        sync: false
      - key: SQUARE_ENV
        value: production
      # Terminal (nút Card trên Expo) — lấy sau khi ghép máy Square Terminal.
      - key: SQUARE_DEVICE_ID
        sync: false

  # App QR order + trả tiền trước (Square Web Payments). Dùng CHUNG token Square với
  # KDS (fromService) -> không phải dán token lần hai.
  - type: web
    name: saigon-order
    runtime: python
    rootDir: order
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SQUARE_ACCESS_TOKEN
        fromService:
          type: web
          name: saigon-kds
          envVarKey: SQUARE_ACCESS_TOKEN
      - key: SQUARE_ENV
        value: production
      - key: SQUARE_APP_ID
        value: sq0idp-R2pC1O8mL1vflr75QPK6Jg
      - key: SQUARE_LOCATION_ID
        value: LHV2HVC64GAVJ
      - key: PYTHON_VERSION
        value: 3.12.7
